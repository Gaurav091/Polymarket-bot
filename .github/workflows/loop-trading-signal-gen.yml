name: Loop Trading Signal Generation

on:
  schedule:
    - cron: '*/5 9-15 * * 1-5'
  workflow_dispatch:  # Manual trigger

jobs:
  run-loop:
    runs-on: self-hosted
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install UV
        run: pip install uv
      - name: Sync dependencies
        run: uv sync --extra dev
      - name: Run loop iteration
        run: python starters/trading-signal-gen/run_signal_gen.py --symbol NIFTY --system index --once
        env:
          LOOP_PATTERN: trading-signal-gen
          LOOP_LEVEL: L1
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loop-logs-trading-signal-gen
          path: logs/
